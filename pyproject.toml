[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "news-mcp"
version = "1.0.0"
description = "Extensible, traceable multi-site news MCP server"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "mcp==2.3.0",
  "httpx==0.28.1",
  "beautifulsoup4==4.15.0",
  "lxml==6.1.3",
  "PyYAML==6.0.3",
  "feedparser==6.0.14",
  "tzdata==2026.6",
]

[project.optional-dependencies]
test = [
  "pytest==9.2.0",
  "pytest-asyncio==1.5.0",
]

[project.scripts]
news-mcp = "news_mcp.server:main"
news-mcp-cli = "news_mcp.cli:main"

[tool.setuptools.packages.find]
include = ["news_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
markers = [
  "network: real network integration test; skipped with -m 'not network'",
]
addopts = "-ra"
